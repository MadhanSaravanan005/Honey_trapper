<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Manual Scanner</title>
    <style>
      body { font-family: Arial, sans-serif; width: 320px; padding: 12px; }
      textarea { width: 100%; height: 100px; }
      .row { margin-top: 8px; }
      .result { font-weight: bold; margin-top: 10px; }
      .malicious { color: #b22222; }
      .normal { color: #2e8b57; }
      .small { font-size: 12px; color: #666; }
    </style>
  </head>
  <body>
    <h3>Manual Scan</h3>
    <label class="small">API URL</label>
    <input id="apiUrl" type="text" value="http://localhost:8000/predict" style="width:100%" />

    <div class="row">
      <textarea id="inputText" placeholder="Paste text here"></textarea>
    </div>

    <div class="row">
      <button id="scanBtn">Scan</button>
    </div>

    <div id="status" class="small"></div>
    <div id="result" class="result"></div>

    <script src="popup.js"></script>
  </body>
</html>
